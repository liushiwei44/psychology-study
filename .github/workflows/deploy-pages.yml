name: Deploy study app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify study rules and progress preservation
        run: node --test tests/*.test.mjs

      - name: Prepare static site
        run: |
          mkdir -p dist/data
          cp index.html styles.css app.js study-rules.mjs study-queues.mjs progress-storage.mjs exam-engine.mjs config.js supabase-sync.js .nojekyll dist/
          cp data/questions.json data/import_report.json data/duplicate_report.json data/case-exercises.json data/exam-templates.json data/exam-inventory.json dist/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
